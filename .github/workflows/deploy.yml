name: Deploy

# Build + deploy to production. MANUAL trigger only for now (Run workflow →
# choose the unit). After Gate C ships, flip to auto-on-merge by uncommenting
# the `push: branches: [main]` block below — that one line is the whole switch
# (see ops/DEPLOY.md §flip). Merging to main is then the release "go".
#
# Model: the built jar is uploaded to <base>/releases/<sha>/ and ops/deploy.sh
# (on the server) takes a pre-deploy DB dump, repoints the <base>/current
# symlink, restarts the unit, health-checks, and AUTO-ROLLS-BACK on failure.
#
# REQUIRED repo secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY   — private key of the dedicated CI `deploy` user (NOT root)
#   DEPLOY_HOST      — 168.119.64.239 / savdopro.topsites.uz
#   DEPLOY_USER      — deploy
# Optional secrets: DEPLOY_PORT (default 22)
# Required variables: LICENSE_URL (public host, VITE_LICENSE_URL for the build)
# Optional variables: MXIK_PROXY_URL (VITE_MXIK_PROXY_URL; blank = off, as today)
on:
  workflow_dispatch:
    inputs:
      unit:
        description: "Which service to deploy"
        type: choice
        default: backend
        options: [backend, license]
  # --- Gate-C flip: uncomment to release automatically on merge to main ---
  # push:
  #   branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  # workflow_dispatch → the chosen unit; push (after the flip) → backend.
  UNIT: ${{ github.event.inputs.unit || 'backend' }}

jobs:
  # Tests GATE the deploy: a red suite means no jar reaches the server.
  test-backend:
    name: Backend tests (gate)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress test

  test-license:
    name: License-server tests (gate)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: license-server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress test

  deploy:
    name: Build & deploy (${{ github.event.inputs.unit || 'backend' }})
    runs-on: ubuntu-latest
    needs: [test-backend, test-license]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 1) Frontend (backend unit only — the SPA is bundled INTO the backend jar)
      - name: Build web frontend
        if: env.UNIT == 'backend'
        working-directory: frontend
        env:
          VITE_TARGET: web
          VITE_LICENSE_URL: ${{ vars.LICENSE_URL }}
          # D0's home: blank = off (as today); set the Actions var when D1 lands.
          VITE_MXIK_PROXY_URL: ${{ vars.MXIK_PROXY_URL }}
        run: |
          test -n "$VITE_LICENSE_URL" || { echo "::error::Set Actions variable LICENSE_URL to the public host before deploying"; exit 1; }
          case "$VITE_LICENSE_URL" in
            *167-172-164-214.nip.io*|*167.172.164.214*) echo "::error::LICENSE_URL still points at the OLD server"; exit 1 ;;
          esac
          npm ci
          npm run build
          # Guard a partial build (a dropped lazy chunk 404s at runtime): assert
          # each key page chunk + a sane total, else FAIL loudly (incident 2026-06-04).
          ASSETS=../backend/src/main/resources/static/assets
          n=$(ls "$ASSETS"/*.js | wc -l); echo "frontend js chunks: $n"
          for p in Dashboard ProductEditor Payments Reports Customers Warehouse Orders Debt; do
            ls "$ASSETS" | grep -qE "^${p}-" || { echo "::error::frontend build missing the $p chunk — refusing to deploy"; exit 1; }
          done
          [ "$n" -ge 25 ] || { echo "::error::frontend build produced only $n chunks (expected >=25) — refusing to deploy"; exit 1; }

      - name: Build backend jar
        if: env.UNIT == 'backend'
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress -DskipTests clean package
          # jar:jar can intermittently omit src/main/resources (incident 2026-06-02):
          # repackage target/classes and ASSERT the bundled resources are present.
          ok=0
          for attempt in 1 2 3; do
            ./mvnw -B --no-transfer-progress -o jar:jar spring-boot:repackage
            props=$(jar tf target/barakat-market.jar | grep -c 'BOOT-INF/classes/application.properties' || true)
            sql=$(jar tf target/barakat-market.jar | grep -cE 'db/migration/V.*\.sql' || true)
            ui=$(jar tf target/barakat-market.jar | grep -c 'BOOT-INF/classes/static/index.html' || true)
            echo "attempt $attempt: props=$props sql=$sql static=$ui"
            if [ "$props" -ge 1 ] && [ "$sql" -ge 20 ] && [ "$ui" -ge 1 ]; then ok=1; break; fi
          done
          [ "$ok" = "1" ] || { echo "::error::jar is missing bundled resources after 3 attempts"; exit 1; }

      - name: Build license-server jar
        if: env.UNIT == 'license'
        working-directory: license-server
        run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress -DskipTests clean package

      # 2) Upload the jar to releases/<sha>/ and run the server-side deploy.sh
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$HOST" || { echo "::error::DEPLOY_HOST is empty"; exit 1; }
          case "$HOST" in
            167.172.164.214|167-172-164-214.nip.io) echo "::error::DEPLOY_HOST still points at the OLD server"; exit 1 ;;
          esac
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/id_deploy -p $PORT $USER@$HOST"
          SCP="scp -i $HOME/.ssh/id_deploy -P $PORT"

          case "$UNIT" in
            backend) BASE=/opt/barakat;  JAR=$(ls backend/target/*.jar | grep -v original | head -1); NAME=barakat-market.jar ;;
            license) BASE=/opt/savdopro; JAR=$(ls license-server/target/*.jar | grep -v original | head -1); NAME=savdopro-license-server.jar ;;
            *) echo "::error::unknown unit $UNIT"; exit 1 ;;
          esac
          SHA_SHORT="${SHA:0:12}"

          # Refresh the server-side scripts + stage the jar into releases/<sha>/.
          $SSH "mkdir -p ~/ops $BASE/releases/$SHA_SHORT"
          $SCP ops/deploy.sh ops/backup-postgres.sh "$USER@$HOST:~/ops/"
          $SCP "$JAR" "$USER@$HOST:$BASE/releases/$SHA_SHORT/$NAME"
          $SSH "chmod +x ~/ops/deploy.sh ~/ops/backup-postgres.sh"

          # Run the deploy; tee everything to a log we upload as an artifact.
          set +e
          $SSH "bash ~/ops/deploy.sh $UNIT $SHA_SHORT" 2>&1 | tee deploy.log
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"

      - name: Upload deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log-${{ github.event.inputs.unit || 'backend' }}-${{ github.run_id }}
          path: deploy.log
          retention-days: 30
          if-no-files-found: ignore
